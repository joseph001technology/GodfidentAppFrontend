org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
# Caps how many compiler/worker processes run concurrently — the crash logs
# showed a native (non-heap) malloc failure during a 3-ABI assembleRelease,
# which on a 4-core/15GB machine means too many parallel JVM processes are
# competing for memory at once, not that any single one needs more heap.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
